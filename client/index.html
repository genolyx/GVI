<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <meta name="description" content="Genolyx Variant Curation — AI-assisted clinical genomics interpretation" />
    <title>Genolyx Variant Curation</title>
    <script>
      (function () {
        try {
          var theme = localStorage.getItem("gvi-theme") || "dark";
          if (theme === "dark") document.documentElement.classList.add("dark");
          var step = parseInt(localStorage.getItem("gvi-font-step") || "1", 10);
          if (!(step >= 1 && step <= 5)) step = 1;
          var scales = { 1: 1, 2: 1.1, 3: 1.2, 4: 1.32, 5: 1.45 };
          document.documentElement.style.setProperty("--font-scale", String(scales[step] || 1));
          document.documentElement.setAttribute("data-font-step", String(step));
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {}
      })();
    </script>
    <link rel="icon" href="/favicon.ico?v=8" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=8" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png?v=8" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png?v=8" />
    <link rel="shortcut icon" href="/favicon.ico?v=8" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Umami analytics: set both env vars at build time to enable.
         Leave unset locally — unsubstituted %VAR% placeholders break Express routing. -->
  </body>
</html>

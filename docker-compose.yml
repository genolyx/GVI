services:
  db:
    image: postgres:17-alpine
    container_name: gvi-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: gvi
      POSTGRES_USER: gvi_user
      POSTGRES_PASSWORD: gvi_password
    ports:
      - "5433:5432"   # host 5433 → container 5432 (5432 may be taken by another project)
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gvi_user -d gvi"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: gvi-redis
    restart: unless-stopped
    # Engine workers use Redis for the shared external-API response cache and
    # source-level rate limiting. Cache loss is harmless, so no persistence.
    command: redis-server --save "" --appendonly no --maxmemory 2gb --maxmemory-policy allkeys-lru
    ports:
      - "6380:6379"   # host 6380 → container 6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: gvi-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: gvi_minio_user
      MINIO_ROOT_PASSWORD: gvi_minio_password
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # MinIO web console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  minio_data:
